const $=s=>document.querySelector(s),cl=(x,a=-1,b=1)=>Math.max(a,Math.min(b,x)),sum=a=>a.reduce((s,x)=>s+x,0),avg=a=>a.length?sum(a)/a.length:0,sd=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};

/* ===== ANALYSIS: six rule-based "analysts" ===== */
function analyze(D){
 const{m1,m5,m15}=D;if(m1.length<60||m5.length<30||m15.length<12)throw new Error('not enough candle history');

function chart(m1,R){
 const W=360,H=210,N=45,T=60,xs=W/T,b=m1.slice(-N),ys=[...b.flatMap(x=>[x.h,x.l]),R.hi,R.lo,R.bull,R.bear,R.inv??R.P];let mx=Math.max(...ys),mn=Math.min(...ys);const pd=(mx-mn)*.06||1;mx+=pd;mn-=pd;
 const y=v=>6+(mx-v)/(mx-mn)*(H-12),x=i=>i*xs+xs/2;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Recent 1-minute candles with the 15-minute forecast range"><rect x="${N*xs}" y="${y(R.hi)}" width="${(T-N)*xs}" height="${Math.max(2,y(R.lo)-y(R.hi))}" fill="#4da3ff" opacity=".2"/>`;
 b.forEach((k,i)=>{const c=k.c>=k.o?'#19d37a':'#ff4d5e';s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${c}"/><rect x="${x(i)-xs*.3}" y="${y(Math.max(k.o,k.c))}" width="${xs*.6}" height="${Math.max(1,Math.abs(y(k.o)-y(k.c)))}" fill="${c}"/>`});
 s+=`<line x1="${x(N-1)}" y1="${y(R.P)}" x2="${W-2}" y2="${y(R.P)}" stroke="#7d8a9a" stroke-dasharray="2 3"/><line x1="${x(N-1)}" y1="${y(R.P)}" x2="${W-4}" y2="${y(R.pred)}" stroke="#4da3ff" stroke-width="2.5" stroke-dasharray="6 4"/>`;
 if(R.inv!=null)s+=`<line x1="0" x2="${W}" y1="${y(R.inv)}" y2="${y(R.inv)}" stroke="#f5b83d" stroke-dasharray="3 4"/>`;
 return s+'</svg>'}
function view(R,asset){
 const D=R.D,now=Date.now(),lab=R.dir=='UP'?'🟢 UP':R.dir=='DOWN'?'🔴 DOWN':'⚪ NEUTRAL · NO TRADE',n=Math.round(R.strength/10);
 const ic=v=>v>.12?'🟢':v<-.12?'🔴':'⚪';
 pred={id:now,asset,dir:R.dir,start:R.P,target:R.pred,lo:R.lo,hi:R.hi,sig:R.sig,end:now+9e5,sim:D.sim};
 hist.push({id:now,t:now,asset,dir:R.dir,tg:R.pred,a:null,r:'p',sim:D.sim});save();renderHist();
 $('#out').innerHTML=`<div class="card">${D.sim?'<div class="sim">🧪 SIMULATED DATA — NOT REAL PRICES</div>':''}
 <div class="sig ${R.dir}">${lab}</div>${R.low?'<div class="warn">⚠️ LOW CONFIDENCE — MARKET CONDITIONS UNCLEAR</div>':''}
 <h2 style="text-align:center;margin:6px 0 0">15-MIN PROBABILITY</h2>
 <div class="pr"><span class="UP">UP ${R.up}%</span><span class="DOWN">DOWN ${R.dn}%</span><span class="NEUTRAL">NEUTRAL ${R.ne}%</span></div>
 <div class="two"><div><small>${asset} NOW</small><span class="num">${fp(R.P)}</span></div><div><small>15-MIN TARGET</small><span class="num ${R.dir}">${fp(R.pred)}</span></div></div>
 <div class="row"><span>Expected range</span><b class="mono">${fp(R.lo)} — ${fp(R.hi)}</b></div>
 <div class="row"><span>Estimated move</span><b class="mono">${R.mv>=0?'+':''}${R.mv.toFixed(3)}%</b></div>
 <div class="row"><span>Confidence</span><b class="mono">${R.conf!=null?R.conf+'%':'— (no trade)'}</b></div>
 <div class="bar">${'█'.repeat(n)+'░'.repeat(10-n)} ${R.strength}%</div><div class="mu" style="text-align:center">SIGNAL STRENGTH</div>
 <div id="cdbox"><span class="k">⏱️ PREDICTION WINDOW</span><span id="cd">15:00</span></div></div>
 <div class="card"><h2>MARKET REGIME</h2><div class="num" style="font-size:20px">${R.reg[0]} ${R.reg[1]}</div></div>
 <div class="card"><h2>WHY?</h2><ul class="ul">${R.why.map(w=>`<li>${w.v>0?'🟢':w.v<0?'🔴':'⚪'} ${esc(w.t)}</li>`).join('')}${R.F.map(f=>`<li>⚠️ ${esc(f)}</li>`).join('')}</ul></div>
 <div class="card"><h2>PRICE TARGETS</h2><div class="grid"><div><span class="k">CURRENT</span><b>${fp(R.P)}</b></div><div><span class="k">15-MIN TARGET</span><b>${fp(R.pred)}</b></div><div><span class="k">BULLISH TARGET</span><b class="UP">${fp(R.bull)}</b></div><div><span class="k">BEARISH TARGET</span><b class="DOWN">${fp(R.bear)}</b></div></div>
 <div class="row" style="margin-top:10px"><span>Invalidation level</span><b class="mono" style="color:var(--am)">${R.inv!=null?fp(R.inv):'n/a — no trade'}</b></div>
 <p class="mu">Targets use nearby 5m swing highs/lows and recent realized volatility (±1σ ≈ ${fp(R.sig)} over 15 min), not fixed percentages.</p></div>
 <div class="card"><h2>1-MIN CANDLES + FORECAST</h2>${chart(R.m1,R)}<p class="mu">Blue dashed = forecast path, shaded = ≈68% expected range, amber = invalidation.</p></div>
 <div class="card"><details><summary>🧠 Analyst breakdown (6)</summary>${R.ag.map(a=>`<div class="ag"><b>${a.name==='Volatility'||a.name==='Risk'?'⚪':ic(a.s)} ${a.name}</b>${a.w?` <span class="mu">lean ${a.s>=0?'+':''}${a.s.toFixed(2)}</span>`:''}<br>${a.notes.map(n=>esc(n[0])).join('<br>')}</div>`).join('')}</details></div>
 <div class="card mu">🕒 ${D.sim?'SIMULATED data':D.src} · last candle ${hm(R.m1.at(-1).t)} · fetched ${hms(now)}<br>📰 News check: not available in this page (no web access) — check headlines before acting.</div>`;
 clearInterval(timer);timer=setInterval(tick,500);$('#out').scrollIntoView({behavior:'smooth',block:'start'})}
function tick(){if(!pred)return;const l=pred.end-Date.now();if(l<=0){clearInterval(timer);finish();return}const e=$('#cd');if(e)e.textContent=mmss(l)}
async function finish(){
 const p=pred;let act=null;
 try{act=p.sim?p.start+(Math.random()+Math.random()+Math.random()-1.5)*2*p.sig:(await ACTIVE.candles(p.asset,60)).at(-1).c}catch(e){}
 let r='x';if(act!=null)r=p.dir=='NEUTRAL'?'n':(p.dir=='UP'?act>p.start:act<p.start)?'w':'l';
 const h=hist.find(x=>x.id==p.id);if(h){h.a=act;h.r=r}save();renderHist();
 const df=act!=null?act-p.target:null,inr=act!=null&&act>=p.lo&&act<=p.hi;
 const el=$('#cdbox');if(!el)return;
 el.innerHTML=`<div class="sig" style="font-size:22px">🔔 PREDICTION COMPLETE</div>`+(act==null?'<div class="warn">Actual price unavailable — this prediction was not scored.</div>':`
 <div class="row"><span>Starting price</span><b class="mono">${fp(p.start)}</b></div><div class="row"><span>Predicted price</span><b class="mono">${fp(p.target)}</b></div><div class="row"><span>Actual price</span><b class="mono">${fp(act)}</b></div>
 <div class="row"><span>Difference vs prediction</span><b class="mono">${df>=0?'+':'-'}${fp(Math.abs(df))} (${(df/p.target*100).toFixed(3)}%)</b></div>
 <div class="row"><span>Inside expected range</span><b>${inr?'Yes ✅':'No ❌'}</b></div>
 <div class="row"><span>Call</span><b>${p.dir}: ${r=='w'?'✅ Correct':r=='l'?'❌ Wrong':'— no trade'}</b></div>`)+`<button class="big" id="again" style="margin-top:12px">🔄 RUN NEW PREDICTION</button>`;
 $('#again').onclick=run}
function renderHist(){
 const sc=hist.filter(h=>!h.sim&&(h.r=='w'||h.r=='l')),w=sc.filter(h=>h.r=='w').length,S={w:'✅',l:'❌',n:'—',p:'⏳',x:'?'};
 $('#hist').innerHTML=`<h2>📊 SESSION HISTORY</h2><div class="stats"><div><b>${sc.length}</b>Predictions</div><div><b>${w}</b>Correct</div><div><b>${sc.length-w}</b>Incorrect</div><div><b>${sc.length?Math.round(100*w/sc.length)+'%':'—'}</b>Accuracy</div></div>`+
 (hist.length?`<div class="tw"><table><tr><th>Time</th><th>Asset</th><th>Call</th><th>Target</th><th>Actual</th><th></th></tr>${hist.slice(-20).reverse().map(h=>`<tr><td>${hm(h.t)}</td><td>${h.sim?'🧪 ':''}${esc(h.asset)}</td><td>${h.dir=='UP'?'🟢 UP':h.dir=='DOWN'?'🔴 DOWN':'⚪ —'}</td><td>${fp(h.tg)}</td><td>${h.a!=null?fp(h.a):'…'}</td><td>${S[h.r]}</td></tr>`).join('')}</table></div>`:'<p class="mu">No predictions yet.</p>')+
 '<p class="mu">Counts only live UP/DOWN calls (simulated runs and no-trades excluded). Small samples are noise; past accuracy does not predict future results.</p>'}
function unavail(e){
 $('#out').innerHTML=`<div class="card"><div class="warn" style="font-size:16px">⚠️ LIVE DATA UNAVAILABLE</div>
 <p>Couldn't load live ${esc(sel)} candles (${esc(e.message||e)}). No prediction was made — a 15-minute forecast can't be reliably built from missing or stale data.</p>
 <p class="mu"><b>To go live you need:</b> a CORS-enabled candle feed — e.g. Coinbase Exchange <span class="mono">/products/{id}/candles</span> (no key), Kraken OHLC, or Binance klines (also gives taker buy/sell volume) — or a market-data connector. It tries Coinbase, Kraken, then Bitstamp (reasons are in the line above). To add a feed, edit <span class="mono">SOURCES</span>; it only has to return <span class="mono">[{t,o,h,l,c,v}]</span> oldest-first.</p>
 <button class="big" id="simb" style="background:#3b2a5c;min-height:52px">🧪 TRY FAKE DATA (UI test only)</button><p class="mu">Simulated data is random and clearly labeled — it only lets you try the interface and engine.</p></div>`;
 $('#simb').onclick=()=>{sim=true;run()}}
async function run(){
 if(busy)return;busy=true;clearInterval(timer);pred=null;const g=$('#go');g.disabled=true;g.textContent='⏳ ANALYZING…';$('#out').innerHTML='';
 $('#st').innerHTML=sim?'🧪 Simulated mode — <span class="lk" id="ex">exit</span>':`Pulling ${esc(sel)} candles (1m · 5m · 15m)…`;
 const ex=$('#ex');if(ex)ex.onclick=()=>{sim=false;$('#st').textContent=''};
 try{let D;try{D=sim?simData():await getLive()}catch(e){unavail(e);return}
  try{view(analyze(D),sel)}catch(e){unavail(e)}}
 finally{g.disabled=false;g.textContent='🔮 PREDICT NEXT 15 MINUTES';busy=false;if(!sim)$('#st').textContent=''}}
$('#go').onclick=run;chips();renderHist();pulse();setInterval(pulse,10000);
</script></body></html>
